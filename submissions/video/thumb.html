<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=Geist:wght@500;700&family=Geist+Mono:wght@500&display=swap">
<style>*{margin:0;box-sizing:border-box}body{width:1280px;height:720px;overflow:hidden;background:radial-gradient(ellipse at 72% 50%,#6A3218 0%,#2A1A12 45%,#1C1510 75%);color:#F3EADB;font-family:Geist,sans-serif;position:relative}
.orb{position:absolute;right:120px;top:150px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#FFF6D8 0%,#F7C77F 28%,#F2A84A 52%,#8A4A12 78%,transparent 80%);box-shadow:0 0 180px 60px #B85E14}
.phone{position:absolute;right:300px;top:330px;width:170px;height:300px;border-radius:30px;background:#120D0A;border:3px solid #F2A84A;transform:rotate(-10deg);box-shadow:0 30px 80px #000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.bars{display:flex;gap:6px;height:60px;align-items:center}.bars i{width:8px;border-radius:4px;background:#F2A84A}
h1{position:absolute;left:70px;top:120px;font-family:Fraunces,serif;font-weight:700;font-size:118px;line-height:.95;letter-spacing:-2px}
h1 em{color:#F7C77F}
.tag{position:absolute;left:74px;top:60px;font-family:"Geist Mono";font-size:26px;letter-spacing:4px;color:#F2A84A;text-transform:uppercase}
.sub{position:absolute;left:74px;bottom:70px;font-size:40px;font-weight:700;background:#F2A84A;color:#1C1510;padding:14px 28px;border-radius:16px}
</style></head><body>
<p class="tag">AI voice agent · built in 1 day</p>
<h1>Heat pump<br>in your home?<br><em>Just call.</em></h1>
<div class="orb"></div>
<div class="phone"><p style="font-family:Geist Mono;font-size:16px;color:#F2A84A">ON CALL</p><div class="bars"><i style="height:20px"></i><i style="height:50px"></i><i style="height:34px"></i><i style="height:60px"></i><i style="height:26px"></i><i style="height:44px"></i><i style="height:18px"></i></div></div>
<p class="sub">Answer in minutes, not a site visit</p>
</body></html>
